# /etc/sysctl.d/99-dominus-lowlatency.conf
# ==============================================================================
# Dominus Polymarket CLOB Low-Latency Kernel Tuning (GCP VirtIO / gVNIC, 2 vCPU)
# Install on Linux VM:
#   sudo cp systemd/99-dominus-lowlatency.conf /etc/sysctl.d/99-dominus-lowlatency.conf
#   sudo sysctl --system
# ==============================================================================

# 1. CRITICAL: Never reset TCP cwnd after idle gaps between bursty CLOB orders!
#    Eliminates extra congestion-window RTTs when firing multi-packet POST /orders
#    after a 3-30s quiet window on a pooled TLS 1.3 socket.
net.ipv4.tcp_slow_start_after_idle = 0

# 2. BBR congestion control + Fair Queueing pacing (absorbs Cloudflare/WAN microbursts)
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr

# 3. Aggressive kernel TCP keepalive (prevents GCP NAT / Cloudflare idle socket drops)
net.ipv4.tcp_keepalive_time = 15
net.ipv4.tcp_keepalive_intvl = 5
net.ipv4.tcp_keepalive_probes = 3
net.ipv4.tcp_fin_timeout = 10
net.ipv4.tcp_tw_reuse = 1
net.ipv4.tcp_fastopen = 3
net.ipv4.tcp_mtu_probing = 1
net.ipv4.tcp_sack = 1
net.ipv4.tcp_timestamps = 1

# 4. Bounded busy-polling (shaves ~20-50 us epoll wake jitter on uvloop sockets without pegging vCPUs)
net.core.busy_read = 50
net.core.busy_poll = 50

# 5. Socket buffer ceilings for 10-asset multiplexed WS bursts (BTC/ETH/SOL/XAU/XAG/XRP/BNB/DOGE/HYPE/ZEC)
net.core.rmem_max = 16777216
net.core.wmem_max = 16777216
net.ipv4.tcp_rmem = 4096 262144 16777216
net.ipv4.tcp_wmem = 4096 262144 16777216
net.core.netdev_max_backlog = 16384
net.core.somaxconn = 4096

# 6. Deterministic VM memory & scheduler latency (NOTE: avoid SCHED_FIFO on 2-vCPU Python hosts!)
vm.swappiness = 0
kernel.sched_autogroup_enabled = 0
